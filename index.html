<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тренажер теста</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>📘 Тренажер для подготовки</h1>
            <div id="progress">Вопрос <span id="current">1</span> из <span id="total">0</span></div>
        </header>
        <main>
            <div id="question-container">
                <p id="question-text"></p>
                <div id="options-container"></div>
                <div id="feedback" style="display:none;">
                    <p id="explanation"></p>
                    <p><a id="source-link" href="#" target="_blank">📎 Источник</a></p>
                </div>
                <button id="check-btn" style="display:none;">✅ Проверить</button>
            </div>
            <nav>
                <button id="prev-btn">◀ Предыдущий</button>
                <button id="random-btn">🎲 Случайный</button>
                <button id="next-btn">Следующий ▶</button>
            </nav>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
